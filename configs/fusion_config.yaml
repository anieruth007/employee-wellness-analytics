# Classifier head on top of a FROZEN, room-temperature-pretrained ResNet18 backbone
# (see src/models/resnet_backbone.py::load_frozen_backbone, checkpoints/room_temp_backbone/).
# Input is expression_dim (512, ResNet18's pooled features) concatenated with roi_dim (5,
# raw ROI temperatures — NOT the binary N/C proxy, which caused ~100% accuracy via target
# leakage when it was fed to the classifier; see src/models/fusion_model.py's docstring).
model:
  name: fusion_classifier
  expression_dim: 512         # ResNet18 backbone's pooled feature dim
  roi_dim: 5                  # [nose_temp, forehead_temp, periorbital_temp, upper_lip_temp, differential_index]
  hidden_dims: [128, 64]
  num_classes: 3              # Disengaged, Burned Out, Engaged (see src/roi/labeling.py)
  dropout: 0.3

training:
  # Only the classifier head trains — the ResNet18 backbone is frozen (loaded via
  # load_frozen_backbone, requires_grad=False on all its params, pinned in eval() mode).
  # All other training-loop hyperparameters (epochs, lr, scheduler, batch_size, early
  # stopping, ...) live in configs/cnn_config.yaml's training section — one authoritative
  # source for train.py's training loop.
  checkpoint_dir: checkpoints/fusion
  backbone_checkpoint: checkpoints/room_temp_backbone/backbone_only.pt

class_names: [Disengaged, "Burned Out", Engaged]

data:
  processed_dir: data/processed
  labels_dir: data/labels
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42
