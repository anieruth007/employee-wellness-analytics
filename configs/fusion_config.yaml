# Classifier head on top of thermal_cnn's expression features.
# N/C proxy is NOT part of this classifier's input — see src/models/fusion_model.py's
# module docstring for why (feeding the proxy in caused ~100% accuracy via target leakage,
# since synthesize_engagement_label() derives the training label from that same proxy).
model:
  name: fusion_classifier
  expression_dim: 256         # from thermal_cnn, single-image feature vector
  hidden_dims: [128, 64]
  num_classes: 3              # Disengaged, Burned Out, Engaged (see src/roi/labeling.py)
  dropout: 0.3

training:
  # Trained end-to-end together with thermal_cnn by default (train.py) — the model
  # is small enough post-BiLSTM-removal that joint training fits comfortably in 4GB VRAM.
  # Set freeze_upstream: true only if you want to train the fusion head alone on top of
  # an already-trained/frozen thermal_cnn checkpoint.
  # All other training-loop hyperparameters (epochs, lr, scheduler, batch_size, early
  # stopping, ...) live in configs/cnn_config.yaml's training section — one authoritative
  # source for the joint single-stage training loop, since this classifier head is always
  # trained together with thermal_cnn, never separately.
  checkpoint_dir: checkpoints/fusion
  freeze_upstream: false

class_names: [Disengaged, "Burned Out", Engaged]

data:
  processed_dir: data/processed
  labels_dir: data/labels
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42
