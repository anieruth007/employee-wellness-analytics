# Thermal CNN encoder — single-image expression feature extractor (Pipeline 1)
# No sequence/temporal module: one thermal image in, one 256-dim feature vector out.
model:
  name: thermal_cnn
  input_channels: 1          # normalized 0-255 grayscale thermal, single frame
  input_size: 48              # resized to 48x48 to match single-frame attendance-camera pipeline
  feature_dim: 256
  architecture:
    block1: {out_channels: 32,  conv_layers: 2, pool: 2, dropout: 0.25}   # -> (32, 24, 24)
    block2: {out_channels: 64,  conv_layers: 2, pool: 2, dropout: 0.25}   # -> (64, 12, 12)
    block3: {out_channels: 128, conv_layers: 1, pool: 2, dropout: 0.25}   # -> (128, 6, 6)
    fc: {in_features: 4608, out_features: 256, dropout: 0.5}             # flatten 128*6*6 -> 4608
  pretrained_weights: null

training:
  # Model is small (48x48 input, ~4 conv blocks) — comfortably fits on 4GB VRAM even
  # trained jointly with the fusion head in one pass; no separate-stage VRAM workaround needed.
  # Authoritative source for train.py's joint training loop (fusion_config.yaml's
  # training section only holds fusion-specific fields: checkpoint_dir, freeze_upstream).
  batch_size: 64
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine_with_warmup
  warmup_epochs: 5
  early_stopping_patience: 15   # stop if val_loss hasn't improved in this many consecutive epochs
  mixed_precision: true
  num_workers: 4
  checkpoint_dir: checkpoints/cnn

data:
  raw_dir: data/raw/Charlotte-ThermalFace
  processed_dir: data/processed
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42
