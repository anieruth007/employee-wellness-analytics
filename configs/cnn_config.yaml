# Path 1, stage A — Thermal CNN backbone (spatial feature extractor)
model:
  name: thermal_cnn
  input_channels: 1          # single-channel 16-bit thermal, normalized to float32
  input_size: 224
  feature_dim: 256
  pretrained_weights: null   # path to Charlotte-ThermalFace pretrained checkpoint once trained

training:
  batch_size: 16             # kept small for 4GB VRAM; raise if headroom allows
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  mixed_precision: true      # torch.cuda.amp — important on 4GB VRAM
  num_workers: 4
  checkpoint_dir: checkpoints/cnn

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
